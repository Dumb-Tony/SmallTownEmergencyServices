<!DOCTYPE html>

<head>

<!-- What a pasted link looks like.
     The whole point of this project is a URL you send to somebody, and until now that
     URL previewed as a bare domain with no picture, no title and no description — which
     is the difference between a friend opening it and a friend scrolling past it.
     The image is a real screenshot, generated by tools\_shot-og.js, never a mock-up. -->
<meta name="description" content="A cooperative emergency-response sandbox in one small town. Three trucks, five kinds of call, and a dispatcher who keeps calling whether or not the last job is finished. Play in a browser, alone or with a friend.">
<meta name="theme-color" content="#10121a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Small Town Emergency Services">

<meta property="og:description" content="The town keeps going without you. A volunteer fire and EMS sandbox in the browser — one town, three trucks, and more calls than one person can answer.">
<meta property="og:url" content="https://dumb-tony.github.io/SmallTownEmergencyServices/">

<!-- An inline SVG favicon: a beacon over a dark roofline. Data URI so the game keeps its
     "no second request, no dependencies" property. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310121a'/%3E%3Cpath d='M4 22h24v5H4z' fill='%23b8403a'/%3E%3Cpath d='M16 6l11 9H5z' fill='%23d2a04a'/%3E%3Ccircle cx='16' cy='19' r='3.4' fill='%23ffd166'/%3E%3C/svg%3E">
<script>
/* Crash banner — copied from SomethingsDifferent\somethingsdifferent.html:444 via
   AirportBaggageCrew\index.html, where it has caught real bugs repeatedly
   (Dev\INDEX.md "UI / shell"). Keeps the FIRST error and tallies follow-ons, because
   the first one is nearly always the cause.

   Inline and FIRST on purpose: it must exist before any module is fetched, or a module
   that fails to parse produces a silent white page. */
window.onerror = function (msg, src, line) {
  let b = document.getElementById('err-banner');
  if (!b) {
    b = document.createElement('div'); b.id = 'err-banner';
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#7a1f1f;' +
      'color:#ffd9d9;font:700 13px system-ui,sans-serif;padding:10px 16px;text-align:center';
    (document.body || document.documentElement).appendChild(b);
  }
  if (!b.dataset.first) {
    b.dataset.first = '1';
    b.textContent = '⚠ Game error (send this to Claude): ' + msg + ' [line ' + line + ']';
  } else if (b.textContent.length < 420) {
    b.dataset.n = (+b.dataset.n || 1) + 1;
    b.textContent += '  ·  then: ' + msg + ' [line ' + line + ']';
  }
};
/* Module load/parse failures and rejected promises do not always reach window.onerror. */
window.addEventListener('error', function (e) {
  if (e.target && e.target.tagName === 'SCRIPT') {
    window.onerror('Failed to load script: ' + (e.target.src || '(inline)'), '', 0);
  }
}, true);
window.addEventListener('unhandledrejection', function (e) {
  window.onerror('Unhandled promise rejection: ' + (e.reason && e.reason.message || e.reason), '', 0);
});
/* ES modules are blocked by CORS on file:// — the page must be served over http.
   play.bat does that. See README "Running it". */
if (location.protocol === 'file:') {
  window.onerror('This page must be served over http, not opened from disk — ES modules ' +
                 'are blocked on file://. Run play.bat (or tools\\serve.ps1).', '', 0);
}
</script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <script src="assets/lib/peerjs.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
